<!doctype html>
<html><head><meta charset="utf-8"><title>EZ-Tree trial</title>
</head>
<body><script type="module">
// From esm.sh, not npm: EZ-Tree asks three 0.167 or later as a peer, and npm refuses it beside the
// application's three 0.128 (seen: ERESOLVE). One three for all three imports (?deps=).
import * as THREE from 'https://esm.sh/three@0.170.0';
import { GLTFExporter } from 'https://esm.sh/three@0.170.0/examples/jsm/exporters/GLTFExporter.js';
import { Tree, TreePreset } from 'https://esm.sh/@dgreenheck/ez-tree@1.1.0?deps=three@0.170.0';

import { SPECIES } from '../../src/tree-species.js';

/** Poly Haven's barks (CC0), 1k colour maps, by their id. */
const BARK_URL = (id) => `https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/${id}/${id}_diff_1k.jpg`;

/** One of our species: the preset, its changes, our leaf drawn, the Poly Haven bark. */
async function speciesTree(sp, seed){
  const tree = new Tree();
  tree.loadPreset(sp.from);
  tree.options.seed = seed * 7919;
  sp.set(tree.options);
  tree.options.leaves.tint = 0xffffff;
  tree.generate();
  const leaf = new THREE.CanvasTexture(sp.foliage(seed, (n) => Object.assign(document.createElement('canvas'), { width: n, height: n })));
  leaf.colorSpace = THREE.SRGBColorSpace;
  const bark = await new THREE.TextureLoader().loadAsync(BARK_URL(sp.bark));
  bark.colorSpace = THREE.SRGBColorSpace;
  bark.wrapS = bark.wrapT = THREE.RepeatWrapping;
  bark.repeat.set(sp.barkScale[0], sp.barkScale[1]);
  tree.traverse(m => {
    if (!m.isMesh) return;
    const leaves = m.material.alphaTest > 0;
    m.material.map = leaves ? leaf : bark;
    if (!leaves) { m.material.normalMap = null; m.material.aoMap = null; m.material.roughnessMap = null; }
    if (m.material.color) m.material.color.set(leaves ? 0xffffff : sp.barkTint);
    m.material.needsUpdate = true;
  });
  return tree;
}

async function save(tree, name){
  const size = new THREE.Box3().setFromObject(tree).getSize(new THREE.Vector3());
  const glb = await new GLTFExporter().parseAsync(tree, { binary: true });
  await window.ez.save(name, new Uint8Array(glb), { triangles: tree.triangleCount, size: [size.x, size.y, size.z].map(v => Math.round(v * 10) / 10) });
}

// Our species, two seeds each (two variants of one tree). `?presets` in the URL: EZ-Tree's own presets.
try {
  if (location.search.includes('presets')) {
    for (const name of Object.keys(TreePreset).filter(n => n !== 'Trellis')) {
      for (const seed of [1, 2]) {
        const tree = new Tree();
        tree.loadPreset(name);
        tree.options.seed = seed * 7919;
        tree.generate();
        await new Promise(ok => setTimeout(ok, 200));
        await save(tree, `EZ ${name} ${seed}.glb`);
      }
    }
  } else {
    for (const [name, sp] of Object.entries(SPECIES)) {
      for (const seed of [1, 2]) await save(await speciesTree(sp, seed), `EZ ${name} ${seed}.glb`);
    }
  }
  await window.ez.done();
} catch (e) { await window.ez.done(String(e && e.stack || e)); }
</script></body></html>
