<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Inter, Segoe UI, Arial, sans-serif">
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5aa9ff"/></marker></defs>
<rect x="0" y="0" width="900" height="360" rx="10" fill="#18191c"/>
<rect x="30" y="40" width="200" height="200" rx="4" fill="#cfd2d6"/><rect x="112" y="120" width="36" height="64" rx="2" fill="#b5794a"/><text x="30" y="30" font-size="11" fill="#e7e7e9" font-weight="700" text-anchor="start">1. The source thumbnail (512 px)</text><rect x="300" y="40" width="200" height="200" rx="4" fill="#cfd2d6"/><rect x="382" y="120" width="36" height="64" rx="2" fill="#b5794a"/><rect x="378" y="116" width="44" height="72" rx="0" fill="none" stroke="#5aa9ff" stroke-width="1.2" stroke-dasharray="5 4"/><text x="300" y="30" font-size="11" fill="#e7e7e9" font-weight="700" text-anchor="start">2. The subject, found by its edges</text><rect x="570" y="60" width="300" height="200" rx="4" fill="#cfd2d6"/><rect x="675" y="80" width="90" height="160" rx="3" fill="#b5794a"/><line x1="570" y1="80" x2="870" y2="80" stroke="#5aa9ff" stroke-dasharray="3 3"/><line x1="570" y1="240" x2="870" y2="240" stroke="#5aa9ff" stroke-dasharray="3 3"/><text x="574" y="76" font-size="9" fill="#5aa9ff" text-anchor="start">margin</text><text x="570" y="30" font-size="11" fill="#e7e7e9" font-weight="700" text-anchor="start">3. Recomposed in 3:2: margin, extended background</text><line x1="238" y1="140" x2="292" y2="140" stroke="#5aa9ff" stroke-width="1.4" marker-end="url(#pointe)"/><line x1="508" y1="140" x2="562" y2="150" stroke="#5aa9ff" stroke-width="1.4" marker-end="url(#pointe)"/><circle cx="40" cy="290" r="9" fill="#5aa9ff"/><text x="40" y="294" font-size="11" fill="#0b1a2b" font-weight="700" text-anchor="middle">•</text><text x="56" y="294" font-size="11" fill="#e7e7e9" text-anchor="start">The original is never shown: the card stays empty, then the thumbnail fades in.</text><circle cx="40" cy="314" r="9" fill="#5aa9ff"/><text x="40" y="318" font-size="11" fill="#0b1a2b" font-weight="700" text-anchor="middle">•</text><text x="56" y="318" font-size="11" fill="#e7e7e9" text-anchor="start">Kept in memory by address: the grid, rebuilt on every page, reuses it before display.</text><circle cx="40" cy="338" r="9" fill="#5aa9ff"/><text x="40" y="342" font-size="11" fill="#0b1a2b" font-weight="700" text-anchor="middle">•</text><text x="56" y="342" font-size="11" fill="#e7e7e9" text-anchor="start">A new source's host goes in HOTES_RECADRAGE (store.js), or the thumbnail stays raw.</text>
</svg>
